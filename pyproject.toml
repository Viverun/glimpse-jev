[project]
name = "glimse-jev"
version = "0.1.0"
description = "Fast computer use on the GNOME desktop: a planner model plans, Jev acts and checks."
authors = [
    { name = "Viverun", email = "185501522+Viverun@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "odfpy>=1.4.1",
    "openai>=3.33.0",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "playwright==1.49.1",
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
glimse-jev = "glimse_jev:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
]
